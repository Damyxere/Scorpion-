<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SCORPIONS MUSIC | Quantum Executive Suite</title>
  <link rel="icon" type="image/png" href="https://cdn.discordapp.com/avatars/982317367596032010/beb9319fe4a47df5721f807519c1e95b.png?size=1024">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #030305;
      --bg-surface: rgba(14, 14, 22, 0.7);
      --bg-glass: rgba(8, 8, 14, 0.85);
      --accent: #ff1e3c;
      --accent-secondary: #7928ca;
      --accent-glow: rgba(255, 30, 60, 0.4);
      --text-main: #ffffff;
      --text-muted: #9494a0;
      --border: rgba(255, 255, 255, 0.08);
      --border-active: rgba(255, 30, 60, 0.6);
      --radius-xl: 36px;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%; height: 100dvh;
      background: radial-gradient(circle at 50% 0%, #1a0b1c 0%, #030305 70%);
      color: var(--text-main);
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
    }

    .app-shell {
      width: 100%; height: 100%; max-width: 440px;
      background: var(--bg-base); display: flex; flex-direction: column;
      position: relative; box-shadow: 0 0 120px rgba(0,0,0,0.9), 0 0 40px rgba(121, 40, 202, 0.15);
      overflow: hidden; border: 1px solid var(--border);
    }

    @media (min-width: 441px) {
      .app-shell {
        height: 90vh; max-height: 880px;
        border-radius: var(--radius-xl);
      }
    }

    /* --- SPLASH SCREEN CYBER-LUXURY --- */
    #splash-screen {
      position: absolute; inset: 0; background: #030305; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.7s;
    }
    .splash-logo-container {
      width: 120px; height: 120px; border-radius: 36px; background: linear-gradient(135deg, rgba(255,30,60,0.2), rgba(121,40,202,0.2));
      border: 1.5px solid var(--border-active); box-shadow: 0 0 60px var(--accent-glow), inset 0 0 20px rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center; margin-bottom: 24px;
      animation: quantumPulse 2.5s infinite ease-in-out;
      overflow: hidden; backdrop-filter: blur(10px);
    }
    .splash-logo-container img { width: 100%; height: 100%; object-fit: cover; }
    .splash-title { font-size: 1.4rem; font-weight: 800; letter-spacing: 4px; color: #fff; text-transform: uppercase; background: linear-gradient(90deg, #fff, #ff8095); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .splash-subtitle { font-size: 0.68rem; color: var(--text-muted); letter-spacing: 3px; text-transform: uppercase; margin-top: 8px; }

    @keyframes quantumPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px var(--accent-glow); }
      50% { transform: scale(1.06); box-shadow: 0 0 80px var(--accent), 0 0 30px var(--accent-secondary); }
    }

    /* --- HEADER --- */
    .app-header {
      padding: 20px 24px 14px 24px; display: flex; align-items: center; justify-content: space-between;
      background: rgba(3, 3, 5, 0.6); backdrop-filter: blur(20px); z-index: 10;
      border-bottom: 1px solid var(--border);
    }
    .header-brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.15rem; letter-spacing: 1px; }
    .header-brand img { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--accent); object-fit: cover; box-shadow: 0 0 15px var(--accent-glow); }
    .header-badge { font-size: 0.65rem; font-weight: 800; background: linear-gradient(135deg, rgba(255,30,60,0.2), rgba(121,40,202,0.2)); color: #ff8095; padding: 5px 12px; border-radius: 20px; letter-spacing: 1.5px; border: 1px solid var(--border-active); }

    /* --- NAVIGAZIONE INFERIORE --- */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0; height: 68px;
      background: var(--bg-glass); backdrop-filter: blur(30px);
      border-top: 1px solid var(--border); display: flex; align-items: center;
      justify-content: space-around; z-index: 90;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--text-muted); font-size: 0.6rem; font-weight: 700;
      cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-item.active { color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }
    .nav-item i { font-size: 1.2rem; }

    /* --- SCHERMATE PRINCIPALI --- */
    .app-view {
      position: absolute; top: 75px; bottom: 68px; left: 0; right: 0;
      padding: 0 20px 20px 20px; overflow-y: auto; display: none;
      flex-direction: column; scroll-behavior: smooth;
    }
    .app-view.active { display: flex; }

    /* --- RICERCA HIGH-TECH --- */
    .search-box-wrapper { position: relative; width: 100%; margin-bottom: 22px; }
    .search-input {
      width: 100%; background: var(--bg-surface); border: 1px solid var(--border);
      padding: 14px 18px 14px 48px; border-radius: var(--radius-md);
      color: #fff; font-size: 0.9rem; outline: none; transition: all 0.35s ease;
      backdrop-filter: blur(10px);
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 25px var(--accent-glow); background: rgba(18, 18, 28, 0.9); }
    .search-box-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1rem; }

    #search-results-section { display: none; flex-direction: column; gap: 10px; }
    .clean-result-item {
      background: var(--bg-surface); border: 1px solid var(--border);
      padding: 10px 14px; border-radius: var(--radius-md); display: flex;
      align-items: center; justify-content: space-between; cursor: pointer;
      backdrop-filter: blur(10px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .clean-result-item:hover { background: rgba(255,30,60,0.08); border-color: var(--border-active); transform: translateX(4px); box-shadow: 0 0 20px rgba(255,30,60,0.15); }
    .cri-left { display: flex; align-items: center; gap: 14px; overflow: hidden; }
    .cri-left img { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); }
    .cri-meta { overflow: hidden; }
    .cri-title { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .cri-artist { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Contenuti Home / Griglie */
    .section-heading { font-size: 1.1rem; font-weight: 800; color: #fff; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; letter-spacing: 0.5px; }
    .tracks-grid { display: grid; grid-template-columns: repeat(2, minmax(130px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .track-card {
      background: var(--bg-surface); border: 1px solid var(--border);
      padding: 12px; border-radius: var(--radius-lg); cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .track-card:hover { transform: translateY(-4px); border-color: var(--border-active); box-shadow: 0 10px 30px rgba(255,30,60,0.15); }
    .track-card img { width: 100%; aspect-ratio: 1; border-radius: var(--radius-sm); object-fit: cover; margin-bottom: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .tc-title { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .tc-artist { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }

    /* Gestione Album */
    .btn-executive {
      background: linear-gradient(135deg, var(--accent), #b3002d); color: #fff; border: none; padding: 9px 16px;
      border-radius: var(--radius-sm); font-weight: 700; font-size: 0.75rem;
      cursor: pointer; box-shadow: 0 0 20px var(--accent-glow); display: inline-flex; align-items: center; gap: 7px;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn-executive:hover { opacity: 0.95; transform: scale(1.03); }
    .albums-stack { display: flex; flex-direction: column; gap: 12px; }
    .album-card {
      background: var(--bg-surface); border: 1px solid var(--border);
      padding: 14px 18px; border-radius: var(--radius-md); display: flex;
      align-items: center; justify-content: space-between; backdrop-filter: blur(10px);
      transition: border-color 0.2s;
    }
    .album-card:hover { border-color: rgba(255,255,255,0.2); }
    .ac-name { font-weight: 700; font-size: 0.95rem; color: #fff; }
    .ac-count { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }
    .ac-delete { background: none; border: none; color: #ff4d4d; font-size: 1rem; cursor: pointer; padding: 6px; opacity: 0.8; transition: opacity 0.2s; }
    .ac-delete:hover { opacity: 1; }

    /* --- MINI PLAYER --- */
    .mini-player {
      position: absolute; bottom: 68px; left: 0; right: 0; height: 64px;
      background: rgba(8, 8, 14, 0.9); backdrop-filter: blur(25px);
      border-top: 1px solid var(--border); display: flex; align-items: center;
      justify-content: space-between; padding: 0 16px; z-index: 85; cursor: pointer;
    }
    .mp-left { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; }
    .mp-left img { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border-active); flex-shrink: 0; box-shadow: 0 0 10px var(--accent-glow); }
    .mp-meta { overflow: hidden; }
    .mp-title { font-size: 0.84rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .mp-artist { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mp-toggle-btn {
      width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), #b3002d); color: #fff;
      border: none; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 0.9rem; cursor: pointer;
      box-shadow: 0 0 15px var(--accent-glow); flex-shrink: 0;
      transition: transform 0.2s;
    }
    .mp-toggle-btn:hover { transform: scale(1.08); }

    /* --- FULL PLAYER MODAL (IMMERSIVE PRO) --- */
    #full-player-modal {
      position: absolute; inset: 0; background: radial-gradient(circle at 50% 20%, #220818 0%, #030305 75%); z-index: 200;
      display: none; flex-direction: column; padding: 24px;
      animation: slideUpModal 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUpModal { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .fpm-top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .fpm-close { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    .fpm-close:hover { background: rgba(255,255,255,0.15); }
    .fpm-indicator { font-size: 0.7rem; font-weight: 800; letter-spacing: 2.5px; color: var(--text-muted); text-transform: uppercase; }

    .fpm-artwork-box { width: 100%; aspect-ratio: 1; border-radius: var(--radius-xl); overflow: hidden; margin-bottom: 26px; border: 1px solid var(--border-active); box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 40px var(--accent-glow); position: relative; }
    .fpm-artwork-box img { width: 100%; height: 100%; object-fit: cover; }

    .fpm-meta-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .fpm-names { overflow: hidden; padding-right: 10px; }
    .fpm-track-title { font-size: 1.25rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .fpm-track-artist { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fpm-heart { background: none; border: none; color: var(--accent); font-size: 1.4rem; cursor: pointer; text-shadow: 0 0 10px var(--accent-glow); transition: transform 0.2s; }
    .fpm-heart:hover { transform: scale(1.15); }

    /* Timeline luminescente */
    .fpm-timeline { width: 100%; margin-bottom: 28px; }
    .fpm-slider-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 12px; cursor: pointer; position: relative; overflow: hidden; margin-bottom: 8px; border: 1px solid var(--border); }
    .fpm-slider-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #ff8095); width: 0%; border-radius: 12px; box-shadow: 0 0 12px var(--accent); }
    .fpm-time-info { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-muted); font-weight: 700; }

    /* Controlli Completi Pro */
    .fpm-controls { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
    .fpm-ctrl-icon { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; transition: color 0.2s, transform 0.2s; }
    .fpm-ctrl-icon:hover { color: #fff; transform: scale(1.1); }
    .fpm-jump-group { display: flex; flex-direction: column; align-items: center; font-size: 0.6rem; font-weight: 800; color: var(--text-muted); gap: 3px; cursor: pointer; transition: color 0.2s; }
    .fpm-jump-group:hover { color: #fff; }
    .fpm-main-play { width: 70px; height: 70px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; box-shadow: 0 0 30px rgba(255,255,255,0.3); transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .fpm-main-play:hover { transform: scale(1.08); }
  </style>
</head>
<body>
  <!-- SPLASH SCREEN -->
  <div id="splash-screen">
    <div class="splash-logo-container">
      <img src="https://cdn.discordapp.com/avatars/982317367596032010/beb9319fe4a47df5721f807519c1e95b.png?size=1024" alt="Logo Ufficiale">
    </div>
    <div class="splash-title">Scorpions Music</div>
    <div class="splash-subtitle">Quantum Executive Audio</div>
  </div>

  <!-- INTERFACCIA PRINCIPALE -->
  <div class="app-shell">
    
    <header class="app-header">
      <div class="header-brand">
        <img src="https://cdn.discordapp.com/avatars/982317367596032010/beb9319fe4a47df5721f807519c1e95b.png?size=1024" alt="Logo">
        SCORPIONS
      </div>
      <div class="header-badge">QUANTUM</div>
    </header>

    <!-- VISTA 1: HOME & RICERCA -->
    <div id="view-home" class="app-view active">
      <div class="search-box-wrapper">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="mainSearchInput" class="search-input" placeholder="Esplora brani, artisti, frequenze..." oninput="handleCleanSearch(this.value)">
      </div>

      <!-- Risultati della ricerca mirati -->
      <div id="search-results-section">
        <div class="section-heading">Risultati Mirati</div>
        <div id="search-results-list"></div>
      </div>

      <!-- Contenuto Standard Home -->
      <div id="home-default-content">
        <div class="section-heading">In Evidenza</div>
        <div class="tracks-grid" id="recommendations-grid"></div>
      </div>
    </div>

    <!-- VISTA 2: ALBUM -->
    <div id="view-albums" class="app-view">
      <div class="section-heading" style="margin-bottom: 16px;">
        Collezioni Album
        <button class="btn-executive" onclick="createNewAlbum()"><i class="fa-solid fa-plus"></i> Nuovo</button>
      </div>
      <div class="albums-stack" id="albums-list-container"></div>
    </div>

    <!-- MINI PLAYER -->
    <div class="mini-player" onclick="openFullPlayer()">
      <div class="mp-left">
        <img id="mp-cover" src="https://cdn.discordapp.com/avatars/982317367596032010/beb9319fe4a47df5721f807519c1e95b.png?size=1024" alt="Cover">
        <div class="mp-meta">
          <div class="mp-title" id="mp-title">Pronto alla riproduzione</div>
          <div class="mp-artist" id="mp-artist">Quantum Audio Engine</div>
        </div>
      </div>
      <button class="mp-toggle-btn" id="mp-play-toggle" onclick="event.stopPropagation(); togglePlayState();"><i class="fa-solid fa-play"></i></button>
    </div>

    <!-- BARRA DI NAVIGAZIONE -->
    <nav class="bottom-nav">
      <div class="nav-item active" onclick="switchView('home', event)"><i class="fa-solid fa-house"></i> Home</div>
      <div class="nav-item" onclick="switchView('albums', event)"><i class="fa-solid fa-compact-disc"></i> Album</div>
    </nav>

    <!-- FULL PLAYER MODAL -->
    <div id="full-player-modal">
      <div class="fpm-top-bar">
        <button class="fpm-close" onclick="closeFullPlayer()"><i class="fa-solid fa-chevron-down"></i></button>
        <div class="fpm-indicator">Quantum Stream</div>
        <div style="width: 36px;"></div>
      </div>

      <div class="fpm-artwork-box">
        <img id="fpm-cover" src="https://cdn.discordapp.com/avatars/982317367596032010/beb9319fe4a47df5721f807519c1e95b.png?size=1024" alt="Cover HD">
      </div>

      <div class="fpm-meta-row">
        <div class="fpm-names">
          <div class="fpm-track-title" id="fpm-title">Seleziona traccia</div>
          <div class="fpm-track-artist" id="fpm-artist">Scorpions Studio</div>
        </div>
        <button class="fpm-heart"><i class="fa-solid fa-heart"></i></button>
      </div>

      <div class="fpm-timeline">
        <div class="fpm-slider-bg" onclick="seekAudioPosition(event)">
          <div class="fpm-slider-fill" id="fpm-slider-fill"></div>
        </div>
        <div class="fpm-time-info">
          <span id="fpm-current-time">0:00</span>
          <span id="fpm-duration">0:00</span>
        </div>
      </div>

      <!-- Controlli Completi -->
      <div class="fpm-controls">
        <button class="fpm-ctrl-icon" onclick="previousTrack()" title="Traccia Precedente"><i class="fa-solid fa-backward-step"></i></button>
        
        <div class="fpm-jump-group" onclick="skipTime(-30)" title="Indietro 30 secondi">
          <i class="fa-solid fa-rotate-left" style="font-size: 1rem;"></i>
          <span>-30s</span>
        </div>

        <button class="fpm-main-play" id="fpm-main-play-btn" onclick="togglePlayState()"><i class="fa-solid fa-play" style="color:#000;"></i></button>

        <div class="fpm-jump-group" onclick="skipTime(30)" title="Avanti 30 secondi">
          <i class="fa-solid fa-rotate-right" style="font-size: 1rem;"></i>
          <span>+30s</span>
        </div>

        <button class="fpm-ctrl-icon" onclick="nextTrack()" title="Traccia Successiva"><i class="fa-solid fa-forward-step"></i></button>
      </div>
    </div>

  </div>

  <audio id="core-audio-element"></audio>

<script>
    const SERVER_URL = "http://127.0.0.1:5000";
    const audio = document.getElementById('core-audio-element');
    const DEFAULT_LOGO = "https://cdn.discordapp.com/avatars/982317367596032010/beb9319fe4a47df5721f807519c1e95b.png?size=1024";
    
    let playlistTracks = [];
    let currentTrackIndex = 0;
    let userAlbums = JSON.parse(localStorage.getItem('scorpions_quantum_albums')) || [
      { id: 1, name: "Masterworks", count: 3 },
      { id: 2, name: "Acoustic Live", count: 2 }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if(splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.style.display = 'none', 700);
        }
      }, 900);

      loadHomeRecommendations();
      renderAlbums();
      restorePlayerState();
    });

    function switchView(viewName, event) {
      document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      
      if(viewName === 'home') document.getElementById('view-home').classList.add('active');
      if(viewName === 'albums') document.getElementById('view-albums').classList.add('active');
      
      if(event && event.currentTarget) event.currentTarget.classList.add('active');
    }

    function loadHomeRecommendations() {
      window.handleInitJSONP = function(data) {
        if(data && data.results) {
          playlistTracks = data.results;
          const grid = document.getElementById('recommendations-grid');
          grid.innerHTML = '';
          data.results.forEach((item, index) => {
            const cover = item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '400x400bb') : DEFAULT_LOGO;
            const card = document.createElement('div');
            card.className = 'track-card';
            card.innerHTML = `
              <img src="${cover}" alt="cover">
              <div class="tc-title">${item.trackName}</div>
              <div class="tc-artist">${item.artistName}</div>
            `;
            card.onclick = () => playSpecificTrack(index);
            grid.appendChild(card);
          });
        }
      };
      const s = document.createElement('script');
      s.src = `https://itunes.apple.com/search?term=Scorpions+Rock&entity=song&country=IT&limit=6&callback=handleInitJSONP`;
      document.body.appendChild(s);
    }

    function handleCleanSearch(query) {
      const resultsSection = document.getElementById('search-results-section');
      const defaultContent = document.getElementById('home-default-content');
      const resultsList = document.getElementById('search-results-list');

      if(!query || query.trim() === "") {
        resultsSection.style.display = 'none';
        defaultContent.style.display = 'block';
        return;
      }

      defaultContent.style.display = 'none';
      resultsSection.style.display = 'flex';
      resultsList.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem; padding:10px;">Sintonizzazione frequenze...</div>';

      window.handleSearchJSONP = function(data) {
        resultsList.innerHTML = '';
        if(data && data.results && data.results.length > 0) {
          playlistTracks = data.results;
          data.results.forEach((item, index) => {
            const cover = item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '300x300bb') : DEFAULT_LOGO;
            const row = document.createElement('div');
            row.className = 'clean-result-item';
            row.innerHTML = `
              <div class="cri-left">
                <img src="${cover}" alt="img">
                <div class="cri-meta">
                  <div class="cri-title">${item.trackName}</div>
                  <div class="cri-artist">${item.artistName}</div>
                </div>
              </div>
              <div style="color:var(--accent); font-size:1rem;"><i class="fa-solid fa-play"></i></div>
            `;
            row.onclick = () => playSpecificTrack(index);
            resultsList.appendChild(row);
          });
        } else {
          resultsList.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem; padding:10px;">Nessun risultato rilevato.</div>';
        }
      };

      const oldS = document.getElementById('dynamic-search');
      if(oldS) oldS.remove();

      const s = document.createElement('script');
      s.id = 'dynamic-search';
      s.src = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&country=IT&limit=12&callback=handleSearchJSONP`;
      document.body.appendChild(s);
    }

    async function playSpecificTrack(index) {
      currentTrackIndex = index;
      const track = playlistTracks[index];
      if(!track) return;

      const title = track.trackName;
      const artist = track.artistName;
      const cover = track.artworkUrl100 ? track.artworkUrl100.replace('100x100bb', '600x600bb') : DEFAULT_LOGO;

      document.getElementById('mp-title').innerText = title;
      document.getElementById('mp-artist').innerText = artist;
      document.getElementById('mp-cover').src = cover;

      document.getElementById('fpm-title').innerText = title;
      document.getElementById('fpm-artist').innerText = artist;
      document.getElementById('fpm-cover').src = cover;

      document.getElementById('mp-artist').innerText = "Caricamento stream...";

      try {
        const queryStr = encodeURIComponent(`${title} ${artist}`);
        const res = await fetch(`${SERVER_URL}/stream?q=${queryStr}`);
        const data = await res.json();

        if (data.status === 'success' && data.audio_url) {
          audio.src = data.audio_url;
          audio.play().catch(() => {});
          updatePlayUI(true);
          
          savePlayerState(track, audio.currentTime);
          setupMediaSession(track, cover);
        } else {
          document.getElementById('mp-artist').innerText = "Errore stream server";
        }
      } catch (err) {
        document.getElementById('mp-artist').innerText = "Avvia server.py su Termux";
      }
    }

    function setupMediaSession(track, cover) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.trackName,
          artist: track.artistName,
          album: "Scorpions Quantum Executive",
          artwork: [
            { src: cover, sizes: '96x96', type: 'image/png' },
            { src: cover, sizes: '128x128', type: 'image/png' },
            { src: cover, sizes: '192x192', type: 'image/png' },
            { src: cover, sizes: '512x512', type: 'image/png' },
          ]
        });

        navigator.mediaSession.setActionHandler('play', () => { audio.play(); updatePlayUI(true); });
        navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); updatePlayUI(false); });
        navigator.mediaSession.setActionHandler('previoustrack', () => previousTrack());
        navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
        navigator.mediaSession.setActionHandler('seekbackward', () => skipTime(-30));
        navigator.mediaSession.setActionHandler('seekforward', () => skipTime(30));
      }
    }

    function savePlayerState(track, time) {
      const state = {
        track: track,
        index: currentTrackIndex,
        playlist: playlistTracks,
        currentTime: time,
        isPlaying: !audio.paused
      };
      sessionStorage.setItem('scorpions_quantum_state', JSON.stringify(state));
    }

    function restorePlayerState() {
      const saved = sessionStorage.getItem('scorpions_quantum_state');
      if (saved) {
        try {
          const state = JSON.parse(saved);
          if (state.track) {
            playlistTracks = state.playlist || [];
            currentTrackIndex = state.index || 0;
            
            document.getElementById('mp-title').innerText = state.track.trackName;
            document.getElementById('mp-artist').innerText = state.track.artistName;
            const cover = state.track.artworkUrl100 ? state.track.artworkUrl100.replace('100x100bb', '600x600bb') : DEFAULT_LOGO;
            document.getElementById('mp-cover').src = cover;

            document.getElementById('fpm-title').innerText = state.track.trackName;
            document.getElementById('fpm-artist').innerText = state.track.artistName;
            document.getElementById('fpm-cover').src = cover;
          }
        } catch(e) {}
      }
    }

    function togglePlayState() {
      if(!audio.src) return;
      if(audio.paused) {
        audio.play();
        updatePlayUI(true);
      } else {
        audio.pause();
        updatePlayUI(false);
      }
    }

    function updatePlayUI(isPlaying) {
      document.getElementById('mp-play-toggle').innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
      document.getElementById('fpm-main-play-btn').innerHTML = isPlaying ? '<i class="fa-solid fa-pause" style="color:#000;"></i>' : '<i class="fa-solid fa-play" style="color:#000;"></i>';
    }

    function nextTrack() {
      if(playlistTracks.length === 0) return;
      currentTrackIndex = (currentTrackIndex + 1) % playlistTracks.length;
      playSpecificTrack(currentTrackIndex);
    }

    function previousTrack() {
      if(playlistTracks.length === 0) return;
      currentTrackIndex = (currentTrackIndex - 1 + playlistTracks.length) % playlistTracks.length;
      playSpecificTrack(currentTrackIndex);
    }

    function skipTime(sec) {
      if(!audio.src || isNaN(audio.duration)) return;
      audio.currentTime = Math.min(Math.max(audio.currentTime + sec, 0), audio.duration);
    }

    audio.ontimeupdate = () => {
      if(!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      document.getElementById('fpm-slider-fill').style.width = `${pct}%`;
      document.getElementById('fpm-current-time').innerText = formatTime(audio.currentTime);
      document.getElementById('fpm-duration').innerText = formatTime(audio.duration);
    };

    function seekAudioPosition(e) {
      const bar = e.currentTarget;
      const clickX = e.clientX - bar.getBoundingClientRect().left;
      if(audio.duration) {
        audio.currentTime = (clickX / bar.offsetWidth) * audio.duration;
      }
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function openFullPlayer() { document.getElementById('full-player-modal').style.display = 'flex'; }
    function closeFullPlayer() { document.getElementById('full-player-modal').style.display = 'none'; }

    function renderAlbums() {
      const container = document.getElementById('albums-list-container');
      container.innerHTML = '';
      userAlbums.forEach(album => {
        const div = document.createElement('div');
        div.className = 'album-card';
        div.innerHTML = `
          <div>
            <div class="ac-name">${album.name}</div>
            <div class="ac-count">${album.count} brani archiviati</div>
          </div>
          <button class="ac-delete" onclick="deleteAlbum(${album.id})" title="Elimina"><i class="fa-solid fa-trash-can"></i></button>
        `;
        container.appendChild(div);
      });
      localStorage.setItem('scorpions_quantum_albums', JSON.stringify(userAlbums));
    }

    function createNewAlbum() {
      const name = prompt("Nome della nuova collezione album:");
      if(name && name.trim() !== "") {
        userAlbums.push({ id: Date.now(), name: name.trim(), count: 0 });
        renderAlbums();
      }
    }

    function deleteAlbum(id) {
      if(confirm("Confermi l'eliminazione dell'album?")) {
        userAlbums = userAlbums.filter(a => a.id !== id);
        renderAlbums();
      }
    }
</script>
</html>
